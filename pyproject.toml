[project]
name = "agentic-ai-project-prototype-testing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Parthava", email = "parthavborah@gmail.om" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "numpy>=2.5.4",
    "pydantic>=2.14.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentic-ai-project-prototype-testing = "agentic_ai_project_prototype_testing:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
